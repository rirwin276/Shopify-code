name: Dashboard state tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/ss-dashboard-state.js'
      - 'sections/seller-dashboard.liquid'
      - 'tests/ss-dashboard-state.test.mjs'
      - '.github/workflows/dashboard-state-tests.yml'
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/ss-dashboard-state.test.mjs
