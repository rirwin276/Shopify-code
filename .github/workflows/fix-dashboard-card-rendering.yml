name: Fix dashboard card rendering

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-dashboard-card-rendering.yml

permissions:
  contents: write

jobs:
  patch-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove problematic offscreen card containment
        shell: python
        run: |
          from pathlib import Path

          path = Path("sections/seller-dashboard.liquid")
          text = path.read_text(encoding="utf-8")

          old = """    contain: content;
    content-visibility: auto;
    contain-intrinsic-size: 110px;
"""
          new = """    contain: none;
    content-visibility: visible;
"""

          if old in text:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one rendering block, found {text.count(old)}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("Patched seller-dashboard.liquid")
          elif new in text:
              print("Dashboard rendering fix is already present")
          else:
              raise SystemExit("Expected dashboard rendering block was not found")

      - name: Commit fix
        run: |
          if git diff --quiet -- sections/seller-dashboard.liquid; then
            echo "No dashboard change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sections/seller-dashboard.liquid
          git commit -m "Fix duplicate dashboard card rendering"
          git push
