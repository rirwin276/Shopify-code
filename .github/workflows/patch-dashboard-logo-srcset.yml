name: Patch dashboard logo srcset

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-logo-srcset.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Disable generated srcset on dashboard logos
        shell: python
        run: |
          from pathlib import Path

          dashboard = Path('sections/seller-dashboard.liquid')
          text = dashboard.read_text(encoding='utf-8')

          old = """| image_tag:
                                  loading: 'eager',"""
          new = """| image_tag:
                                  srcset: nil,
                                  loading: 'eager',"""

          matches = text.count(old)
          if matches != 1:
              raise SystemExit(f'Expected exactly one dashboard image_tag target, found {matches}')

          dashboard.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/patch-dashboard-logo-srcset.yml').unlink()

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Disable responsive srcset on dashboard logos"
          git push origin HEAD:main
