name: Remove automatic routing

on:
  push:
    paths:
      - .github/workflows/remove-auto-routing.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove automatic redirects and make store CTAs explicit
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Remove the pre-layout account bouncer and the customer-wide
          # localStorage resume redirect. These were able to hijack dashboard,
          # blog, policy, and account navigation for hours after a form visit.
          theme_path = root / 'layout/theme.liquid'
          theme = theme_path.read_text(encoding='utf-8')

          theme, top_count = re.subn(
              r"\n\{%- unless request\.design_mode -%\}.*?\{%- endunless -%\}\n\n<!doctype html>",
              "\n<!doctype html>",
              theme,
              count=1,
              flags=re.S,
          )

          theme, head_count = re.subn(
              r"(\{\{ content_for_header \}\}\n)\n\s*\{%- if customer -%\}.*?\{%- endif -%\}\n\n(\s*\{%- comment -%\} STELLA & SAGE CUSTOM ASSETS)",
              r"\1\n\2",
              theme,
              count=1,
              flags=re.S,
          )

          replacement_bridge = r'''    {%- comment -%}
      STELLA & SAGE STOREFRONT FORM AUTH CLEANUP
      Navigation is explicit now. Clear legacy resume flags so they cannot
      redirect dashboards, articles, policies, or unrelated pages.
    {%- endcomment -%}
    <script>
      (function () {
        try {
          localStorage.removeItem('sf_pending_form_v1');
          localStorage.removeItem('sf_pending_form_v2');
          localStorage.removeItem('sf_pending_signin_v1');
        } catch (e) {}
      })();
    </script>

'''

          theme, bridge_count = re.subn(
              r"\s*\{%- comment -%\}\n\s*STELLA & SAGE STOREFRONT FORM AUTH BRIDGE.*?</script>\n\n(?=\s*\{%- comment -%\}\n\s*ADMIN GUIDE PANEL)",
              "\n" + replacement_bridge,
              theme,
              count=1,
              flags=re.S,
          )

          if top_count != 1 or head_count != 1 or bridge_count != 1:
              raise SystemExit(
                  f'Expected theme blocks were not found: top={top_count}, head={head_count}, bridge={bridge_count}'
              )

          theme_path.write_text(theme, encoding='utf-8')

          # 2) Explicitly point true store-creation CTAs to the real form.
          direct_files = [
              root / 'sections/main-blog.liquid',
              root / 'sections/main-blog-post.liquid',
              root / 'templates/page.landing-page.json',
              root / 'content/blog-drafts/how-to-start-school-spirit-wear-store.html',
              root / 'content/blog-drafts/best-online-team-store-for-youth-sports.html',
          ]

          for path in direct_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              text = text.replace('/pages/storefront', '/pages/request-storefront-form')
              path.write_text(text, encoding='utf-8')

          # 3) Homepage actions use explicit destinations. Remove the temporary
          # click workaround because the underlying redirect is now gone.
          index_path = root / 'templates/index.json'
          index_text = index_path.read_text(encoding='utf-8')
          index_text = index_text.replace('data-request-url=\\"/pages/storefront\\"', 'data-request-url=\\"/pages/request-storefront-form\\"')
          index_text = index_text.replace('"request_url": "/pages/storefront"', '"request_url": "/pages/request-storefront-form"')
          index_text = index_text.replace('<script src=\\"{{ \'ss-dashboard-direct.js\' | asset_url }}\\" defer=\\"defer\\"></script>', '')
          index_path.write_text(index_text, encoding='utf-8')

          direct_asset = root / 'assets/ss-dashboard-direct.js'
          if direct_asset.exists():
              direct_asset.unlink()

          # 4) Keep the route-guard snippet intentionally inert even when an
          # old theme setting still renders it.
          guard_path = root / 'snippets/ss-auth-route-guard.liquid'
          guard_path.write_text(
              "{%- comment -%}\n"
              "Automatic text-based navigation rewriting was removed. Links now use explicit href values.\n"
              "{%- endcomment -%}\n",
              encoding='utf-8',
          )
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add layout/theme.liquid snippets/ss-auth-route-guard.liquid templates/index.json sections/main-blog.liquid sections/main-blog-post.liquid templates/page.landing-page.json content/blog-drafts assets/ss-dashboard-direct.js || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove automatic routing and use explicit store links"
          git push
