name: Storefront layout tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'sections/private-store-collection.liquid'
      - 'assets/storefront-fixed-layouts.css'
      - 'assets/storefront-template-structure.css'
      - 'tests/js_harness/store_action_panel_harness.js'
      - '.github/workflows/storefront-layout-tests.yml'
jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The hero card's column track is set in one file and its panel's in
      # another, so this measures the rendered result rather than reading
      # either one on its own.
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/js_harness/store_action_panel_harness.js
